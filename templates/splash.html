<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Dollars Login</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; }
        .logo { width: 250px; border: 4px solid blue; border-radius: 12px; margin-bottom: 20px; }
        input { padding: 15px; width: 80%; max-width: 250px; border: 2px solid blue; border-radius: 4px; font-size: 18px; margin-bottom: 10px; }
        button { padding: 15px 30px; background: blue; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 18px; }
        #err { color: red; display: none; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <img src="/static/1773978135981~2.png" class="logo">
    <h2>Enter Beer Dollars</h2>
    <input type="text" id="passcode" placeholder="Enter Code">
    <br>
    <button onclick="checkCode()">Enter</button>
    <p id="err">Invalid Code</p>

    <script>
        async function checkCode() {
            const val = document.getElementById('passcode').value;
            const response = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: val })
            });
            
            if (response.ok) {
                window.location.href = '/main';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
    </script>
</body>
</html>
