<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beer Dollars</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Essential styles to ensure the map is visible */
        #map { 
            height: 350px; 
            width: 100%; 
            background-color: #e5e3df; 
            margin-top: 10px;
            border-top: 2px solid #ddd;
        }
        .card {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .price { color: #2ecc71; font-weight: bold; float: right; }
        .nav-hint { color: #2196F3; font-size: 0.8em; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🍺 Beer Dollars</h1>
    </header>

    <nav id="day-selector">
        <button onclick="loadBars('Monday')">Mon</button>
        <button onclick="loadBars('Tuesday')">Tue</button>
        <button onclick="loadBars('Wednesday')">Wed</button>
        <button onclick="loadBars('Thursday')">Thu</button>
        <button onclick="loadBars('Friday')">Fri</button>
        <button onclick="loadBars('Saturday')">Sat</button>
        <button onclick="loadBars('Sunday')">Sun</button>
    </nav>

    <main>
        <div id="specialsList">
            <p style="text-align:center; padding: 20px;">Detecting location and fetching deals...</p>
        </div>
        
        <div id="map"></div>
    </main>

    <button id="fab" onclick="document.getElementById('add-modal').style.display='block'">+</button>

    <div id="add-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
        <div style="background:white; margin:10% auto; padding:20px; width:80%; border-radius:10px;">
            <h3>Add a Special</h3>
            <input type="text" id="bar-search" placeholder="Search for a bar..." style="width:90%; padding:10px; margin-bottom:10px;">
            <input type="text" id="special-desc" placeholder="Special (e.g. $1 Drafts)" style="width:90%; padding:10px; margin-bottom:10px;">
            <select id="special-day" style="width:95%; padding:10px; margin-bottom:20px;">
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>
            <button onclick="submitBar()" style="background:#2ecc71; color:white; padding:10px; width:100%; border:none;">Publish to Live App</button>
            <button onclick="document.getElementById('add-modal').style.display='none'" style="background:#eee; margin-top:10px; width:100%; border:none; padding:5px;">Cancel</button>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAiEK4CduUBr7EWeqtSsFhG1nQyqON6QYI&libraries=places&callback=initMap" async defer></script>
    <script src="/static/script.js"></script>
</body>
</html>
