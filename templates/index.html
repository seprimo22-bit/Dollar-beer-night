<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Dollars | Login</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding-top: 50px; }
        .logo { width: 200px; border: 3px solid blue; border-radius: 10px; }
        input { padding: 12px; width: 200px; border: 2px solid blue; font-size: 16px; }
        button { padding: 12px 25px; background: blue; color: white; border: none; cursor: pointer; font-weight: bold; }
        #error { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <img src="/static/1773978135981~2.png" class="logo">
    <h1>Enter Beer Dollars</h1>
    <input type="text" id="code" placeholder="Enter Code">
    <button onclick="login()">Enter</button>
    <p id="error">Invalid Code</p>

    <script>
        async function login() {
            const code = document.getElementById('code').value;
            const res = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });
            if (res.ok) {
                window.location.href = '/main';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
